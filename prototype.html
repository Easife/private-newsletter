body {

/* ===== HEADER ===== */

}

  font-weight: 700;
  letter-spacing: 2px;

}
.site-header .date {
  font-size: 15px;
  color: var(--text-secondary);
  margin-top: 6px;
}
.site-header .tagline {
  font-size: 13px;
  color: var(--text-tertiary);

}

/* ===== MAIN ===== */
.container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 24px;
}

/* ===== SECTION TITLES ===== */
.section-title {

.section-title .badge {

  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
}

/* ===== HEADLINE CARDS ===== */
.headlines {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.headline-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, border-color 0.2s;
  position: relative;
}
.headline-card:hover {
  box-shadow: var(--shadow-md);
  border-color: #d0d0d0;
}
.headline-card .rank {
  position: absolute;
  top: 20px;
  left: -1px;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 4px 10px 4px 12px;
  border-radius: 0 6px 6px 0;
  line-height: 1.2;
}
.headline-card .content {
  padding-left: 8px;
}
.headline-card h3 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.headline-card .summary {
  font-size: 14.5px;
  color: var(--text-secondary);
  line-height: 1.75;
  margin-bottom: 12px;
}
.headline-card .meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-tertiary);
  flex-wrap: wrap;
}
.headline-card .meta a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}
.headline-card .meta a:hover {
  text-decoration: underline;
}
.headline-card .meta .dot {
  width: 3px;
  height: 3px;
  background: var(--text-tertiary);
  border-radius: 50%;
}
.headline-card .controversy {
  background: #fff8e1;
  border-left: 3px solid #f0ad4e;
  padding: 8px 12px;
  margin-top: 10px;
  border-radius: 0 4px 4px 0;
  font-size: 13px;
  color: #8a6d3b;
  line-height: 1.6;
}

/* ===== ORDINARY NEWS ===== */
.ordinary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border-light);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.ordinary-item {
  background: var(--surface);
  padding: 16px 20px;
  transition: background 0.15s;
}
.ordinary-item:hover {
  background: #f9f9f8;
}
.ordinary-item h4 {
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1.55;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.ordinary-item .summary {

  color: var(--text-secondary);
  line-height: 1.65;
  margin-bottom: 8px;

  overflow: hidden;
}
.ordinary-item .meta {
  font-size: 12px;
  color: var(--text-tertiary);
}
.ordinary-item .meta a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}
.ordinary-item .meta a:hover {
  text-decoration: underline;
}

/* ===== FOOTER ===== */
.site-footer {
  text-align: center;
  padding: 40px 24px;
  font-size: 13px;
  color: var(--text-tertiary);
  border-top: 1px solid var(--border);
  margin-top: 40px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 700px) {
  .site-header { padding: 28px 16px 24px; }

  .container { padding: 0 16px; }
  .headline-card { padding: 18px 16px 18px 20px; }
  .headline-card h3 { font-size: 16px; }
  .ordinary-grid { grid-template-columns: 1fr; }
}

/* ===== DARK MODE (auto) ===== */
@media (prefers-color-scheme: dark) {

// ============================================================
// 渲染函数
// ============================================================

function renderHeadlines(data) {
  const container = document.getElementById('headlines');
  data.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'headline-card';
    let controversyHTML = '';
    if (item.controversy) {
      controversyHTML = `<div class="controversy">⚠️ 争议：${item.controversy}</div>`;
    }
    card.innerHTML = `
      <div class="rank">${i + 1}</div>
      <div class="content">
        <h3>${item.title}</h3>
        <div class="summary">${item.summary}</div>
        <div class="meta">
          <a href="${item.url}" target="_blank" rel="noopener">${item.source}</a>
          <span class="dot"></span>
          <span>${item.time}</span>
        </div>
        ${controversyHTML}
      </div>
    `;
    container.appendChild(card);
  });
}

function renderOrdinary(data) {
  const container = document.getElementById('ordinary');
  data.forEach(item => {
    const el = document.createElement('div');
    el.className = 'ordinary-item';
    el.innerHTML = `
      <h4>${item.title}</h4>
      <div class="summary">${item.summary}</div>
      <div class="meta">
        <a href="${item.url}" target="_blank" rel="noopener">${item.source}</a>
        · ${item.time}
      </div>
    `;
    container.appendChild(el);
  });
}

// 初始化
renderHeadlines(headlines);
renderOrdinary(ordinary);
</script>

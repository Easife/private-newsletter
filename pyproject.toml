[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-newsletter"
version = "2.2.2"
description = "Windows-first automated private news briefing with a local web control center"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
private-newsletter = "newsletter.cli:main"
private-newsletter-ui = "newsletter.webapp:main"

[tool.setuptools.packages.find]
include = ["newsletter*"]

[tool.setuptools.package-data]
newsletter = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
